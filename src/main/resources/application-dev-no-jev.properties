# dev-no-jev profile.
#
# Real OpenAI narrative and Stripe are active. Jev / TypeSafe judgments and
# external evidence remain fixture-backed. For development machines that cannot reach the
# TypeSafe network.
#
# Required environment variables: OPENAI_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# UNIVERSITY_STRIPE_WEBHOOK_SECRET, A_LEVEL_STRIPE_WEBHOOK_SECRET, and the three Stripe
# price IDs. APP_PUBLIC_BASE_URL defaults to http://localhost:8080; set
# APP_PUBLIC_BASE_URL_ALLOW_HTTP=true when running locally over plain HTTP.
spring.autoconfigure.exclude=org.springaicommunity.typesafe.autoconfigure.TypeSafeAutoConfiguration

# Fixture IDs for the fixture-backed Jev judgment providers. Overridable via environment variables.
app.professional.fixture-id=${PROFESSIONAL_FIXTURE_ID:senior_software_architect}
app.university.fixture-id=${UNIVERSITY_FIXTURE_ID:computer_science}
app.a-level.fixture-id=${A_LEVEL_FIXTURE_ID:maths_economics_geography}
