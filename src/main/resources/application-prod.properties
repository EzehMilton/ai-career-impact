# Production profile.
#
# Only the differences from application.properties live here. Everything the application needs in
# every environment stays in the base file, so there is one place to read for "what does this
# setting do" and one small place to read for "what changes in production".
#
# StartupConfigurationValidator refuses to start this profile without an https public base URL, while Spring Boot
# refuses an unusable datasource. Missing values fail at boot rather than on the first customer request.

# Railway and other production platforms provide PostgreSQL themselves. Never ask Spring Boot's local-development
# Docker Compose integration to start compose.yaml in production. Local profiles retain their existing behaviour.
spring.docker.compose.enabled=false

# Railway injects PORT. The fallback preserves ordinary production starts outside Railway.
server.port=${PORT:8080}

# Behind a reverse proxy or load balancer, trust the standard forwarded headers so that generated
# links and the client address Spring reports reflect the original request rather than the proxy.
# This is only safe because a proxy is the documented deployment shape and it overwrites these
# headers. Exposing the application directly to the internet under this profile would let a caller
# set them. Handled by Spring, never parsed here.
server.forward-headers-strategy=framework

# Session cookies. The session holds the visitor's CSRF token. Lax rather than Strict because returning from Stripe's hosted checkout is a cross-site navigation back into
# the application, and Strict would drop the cookie on arrival. Lax sends it on a top-level GET
# navigation, which is exactly that case, while still withholding it from cross-site POSTs.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Operational endpoints. Health and info only: enough for a load balancer and a deployment to work
# with, and nothing that describes the inside of the application. Probes are published separately
# so liveness and readiness can mean different things.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
# Never describe the inside of a component to an unauthenticated caller.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=false
management.info.java.enabled=true
management.info.os.enabled=false

# Connection pool. Deliberately close to Spring Boot's defaults: these exist so an operator can
# change them without a rebuild, not because a particular number has been measured as correct.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# Flyway runs on startup and validates what is already there. No clean, ever: a production database
# must never be reset by a deployment.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Logging. Quiet enough to read, never detailed enough to leak. SQL and bind parameters stay off:
# a bind parameter is someone's job title or course description.
# One JSON object per line in Elastic Common Schema, so a log platform can filter by level, logger
# or requestId without parsing text. MDC entries, including the requestId, become JSON fields; the
# text pattern in application.properties applies only to the other profiles. Overridable with
# LOGGING_STRUCTURED_FORMAT_CONSOLE, for example to logstash.
logging.structured.format.console=ecs
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.springframework.ai=INFO
logging.level.com.stripe=WARN
logging.level.org.springframework.web.client=WARN
spring.ai.model.decision=openai
