<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div th:replace="~{fragments/layout :: devBanner}"></div>
<header th:replace="~{fragments/layout :: siteHeader('')}"></header>

<main class="page-shell" id="main">
  <section class="panel error-panel" role="alert" aria-labelledby="error-heading">
    <p class="eyebrow">Something went wrong</p>
    <h1 id="error-heading">Something went wrong at our end.</h1>
    <p>Please try again. If it keeps happening, come back a little later.</p>
    <p>Any assessment you have already completed is unaffected and is still available from its link.</p>
    <p class="page-action">
      <a th:href="@{/}" href="/">Back to home</a>
    </p>
  </section>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>
</html>
