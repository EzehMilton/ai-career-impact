<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Too large')}"></head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div th:replace="~{fragments/layout :: devBanner}"></div>
<header th:replace="~{fragments/layout :: siteHeader('')}"></header>

<main class="page-shell" id="main">
  <section class="panel error-panel" aria-labelledby="error-heading">
    <p class="eyebrow">Too large</p>
    <h1 id="error-heading">That file is too large.</h1>
    <p>Please upload a smaller CV. We accept PDF and DOCX files up to 5 MiB.</p>
    <p>You can also skip the upload entirely and type your details into the form.</p>
    <p class="page-action">
      <a th:href="@{/}" href="/">Back to home</a>
    </p>
  </section>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>
</html>
