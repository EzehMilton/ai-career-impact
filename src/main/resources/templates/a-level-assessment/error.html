<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Assessment unavailable')}"></head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div th:replace="~{fragments/layout :: devBanner}"></div>
<header th:replace="~{fragments/layout :: siteHeader('a-level')}"></header>

<main class="page-shell" id="main">
  <section class="panel error-panel" role="alert" aria-labelledby="err-heading">
    <p class="eyebrow">A-level subject check</p>
    <h1 id="err-heading">We couldn't complete your check right now.</h1>
    <p>Please try again. If the problem continues, come back a little later.</p>
    <p>Nothing you have already completed is affected.</p>
    <p class="page-action">
      <a th:href="@{/a-level-assessment}" href="/a-level-assessment">Return to the form</a>
      <a class="button-link button-secondary" th:href="@{/}" href="/">Back to home</a>
    </p>
  </section>
</main>

<footer th:replace="~{fragments/layout :: siteFooter}"></footer>
</body>
</html>
