spring.application.name=ai-career-impact
spring.jpa.open-in-view=false

# Every log line carries the request's correlation id, so a report of "it failed around two o'clock"
# can be tied to the lines that describe it without any user content being logged to search by.
logging.pattern.level=%5p [${spring.application.name:}:%X{requestId:-no-request}]

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.model.chat=openai
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}

spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# TypeSafe / Jev
spring.ai.typesafe.api-key=${TYPESAFE_API_KEY}
spring.ai.typesafe.model=jev-latest

# Evidence is opt-in. The form does not collect geography yet, so V1 uses this explicit UK default.
app.professional.evidence.geography=${PROFESSIONAL_EVIDENCE_GEOGRAPHY:United Kingdom}
# Under the live-evidence profile these two values must be configured together and match exactly.
app.professional.evidence.classified-profession=${PROFESSIONAL_EVIDENCE_PROFESSION:}
app.professional.evidence.canonical-occupation=${PROFESSIONAL_EVIDENCE_CANONICAL_OCCUPATION:}
app.professional.evidence.soc2020-code=${PROFESSIONAL_EVIDENCE_SOC2020_CODE:}

# Paid reports. Stripe is activated only by the explicit live-payment profile.
app.professional.report.base-url=${PROFESSIONAL_REPORT_BASE_URL:http://localhost:8080}
app.professional.report.stripe-price-id=${PROFESSIONAL_REPORT_STRIPE_PRICE_ID:}
app.professional.report.display-price=${PROFESSIONAL_REPORT_DISPLAY_PRICE:}
app.professional.report.pdf.maximum-bytes=${PROFESSIONAL_REPORT_PDF_MAXIMUM_BYTES:5242880}

# CV upload is a transient prefill path. Raw CV bytes are never persisted.
app.professional.cv.maximum-bytes=${PROFESSIONAL_CV_MAXIMUM_BYTES:5242880}
app.professional.cv.maximum-extracted-characters=${PROFESSIONAL_CV_MAXIMUM_EXTRACTED_CHARACTERS:100000}
# A DOCX is a ZIP, so a small upload can still be expensive to read. These bound the work rather
# than the download: no single entry may inflate past the ceiling, and no CV may yield more pages
# or characters than we are willing to process.
app.professional.cv.maximum-pages=${PROFESSIONAL_CV_MAXIMUM_PAGES:50}
app.professional.cv.maximum-entry-bytes=${PROFESSIONAL_CV_MAXIMUM_ENTRY_BYTES:16777216}
app.professional.cv.minimum-inflate-ratio=${PROFESSIONAL_CV_MINIMUM_INFLATE_RATIO:0.01}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# When an upload is refused for being too large, Tomcat still has to read the rest of it before it
# can send a reply. Without headroom above the request limit it resets the connection instead, and
# the person uploading sees a broken connection rather than the page telling them the file is too
# big. Beyond this it still stops reading, so a genuinely enormous body is not swallowed whole.
server.tomcat.max-swallow-size=8MB
# Ordinary (non-multipart) form posts. Every field is individually capped by Bean Validation, and
# the largest journey's fields total well under 20 KB, so this is a generous outer bound rather
# than a constraint anyone should ever meet.
server.tomcat.max-http-form-post-size=256KB

# In-process rate limiting for the operations that cost real work. Reading a page, a past result or
# a stylesheet is never limited. Limits are per application instance: behind a load balancer the
# effective allowance is this multiplied by the number of instances.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.window=${RATE_LIMIT_WINDOW:PT1M}
app.rate-limit.assessment-submission.permits=${RATE_LIMIT_ASSESSMENT_PERMITS:10}
app.rate-limit.cv-upload.permits=${RATE_LIMIT_CV_UPLOAD_PERMITS:5}
app.rate-limit.checkout-start.permits=${RATE_LIMIT_CHECKOUT_PERMITS:10}

# How long a browser may keep the stylesheet. Short enough that a deployed change is picked up
# quickly without content hashing. See StaticResourceConfiguration for why this is applied there
# rather than through spring.web.resources.
app.static-resources.cache-seconds=${STATIC_RESOURCE_CACHE_SECONDS:300}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# University journey. Evidence geography falls back to this when the form supplies no country.
app.university.evidence.geography=${UNIVERSITY_EVIDENCE_GEOGRAPHY:United Kingdom}

# Paid university reports. Stripe is activated only by the explicit live-payment profile and uses
# its own Price and webhook endpoint, separate from the professional product.
app.university.report.base-url=${UNIVERSITY_REPORT_BASE_URL:http://localhost:8080}
app.university.report.stripe-price-id=${UNIVERSITY_REPORT_STRIPE_PRICE_ID:}
app.university.report.display-price=${UNIVERSITY_REPORT_DISPLAY_PRICE:}
app.university.report.pdf.maximum-bytes=${UNIVERSITY_REPORT_PDF_MAXIMUM_BYTES:5242880}
app.stripe.university-webhook-secret=${UNIVERSITY_STRIPE_WEBHOOK_SECRET:${STRIPE_WEBHOOK_SECRET:}}

# A-level journey. Evidence geography falls back to this when the form supplies no country.
app.a-level.evidence.geography=${A_LEVEL_EVIDENCE_GEOGRAPHY:United Kingdom}

# Paid A-level reports. Stripe is activated only by the explicit live-payment profile and uses its
# own Price and webhook endpoint, separate from the professional and university products.
app.a-level.report.base-url=${A_LEVEL_REPORT_BASE_URL:http://localhost:8080}
app.a-level.report.stripe-price-id=${A_LEVEL_REPORT_STRIPE_PRICE_ID:}
app.a-level.report.display-price=${A_LEVEL_REPORT_DISPLAY_PRICE:}
app.a-level.report.pdf.maximum-bytes=${A_LEVEL_REPORT_PDF_MAXIMUM_BYTES:5242880}
app.stripe.a-level-webhook-secret=${A_LEVEL_STRIPE_WEBHOOK_SECRET:${STRIPE_WEBHOOK_SECRET:}}
