# Local development profile.
#
# Default fixture IDs are supplied here so `--spring-boot.run.profiles=local-fixture` starts without
# any extra arguments. Each can still be overridden on the command line, and the active fixture for
# every journey is always displayed in the development banner, so which data is in use is never
# ambiguous. This file is loaded only under the local-fixture profile, so live behaviour is
# untouched: outside this profile a missing or unsupported fixture ID still fails at startup.
app.professional.fixture-id=${PROFESSIONAL_FIXTURE_ID:senior_software_architect}
app.university.fixture-id=${UNIVERSITY_FIXTURE_ID:computer_science}
app.a-level.fixture-id=${A_LEVEL_FIXTURE_ID:maths_economics_geography}

# Disable external AI models only in this development profile.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.embedding.text=none
spring.ai.model.embedding.multimodal=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.autoconfigure.exclude=org.springaicommunity.typesafe.autoconfigure.TypeSafeAutoConfiguration
