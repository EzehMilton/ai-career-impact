# live-smoke profile: local live regression testing. NEVER a deployment profile.
#
# Real OpenAI Decisions judgments (or explicitly selected Jev backup), real OpenAI narratives, PostgreSQL persistence, real reports and
# PDFs. Stripe is not configured, so no checkout or webhook exists; detailed reports are unlocked through
# the ordinary complimentary entitlement path instead. Every page shows a LIVE SMOKE TEST MODE banner.
#
# Only overrides live here; everything else comes from application.properties.
#
# StartupConfigurationValidator refuses this profile unless APP_LIVE_SMOKE_ENABLED=true and OPENAI_API_KEY
# are set. TYPESAFE_API_KEY is required only when JUDGMENT_PROVIDER=jev.
app.live-smoke.enabled=${APP_LIVE_SMOKE_ENABLED:false}

# Assessment tracing defaults to ON in this profile; ASSESSMENT_TRACE_ENABLED=false still turns it off.
# SENSITIVE: trace logs contain the submitted assessment data and complete AI prompts and responses.
app.assessment-trace.enabled=${ASSESSMENT_TRACE_ENABLED:true}
# Labels every trace event, so smoke-test traces are never mistaken for genuine assessments.
app.assessment-trace.execution-mode=LIVE_SMOKE
# Per-assessment trace files (JSONL), local diagnostics only. Under .live-smoke/, which Git ignores and which
# survives ./mvnw clean; delete the folder yourself to remove old traces.
app.live-smoke.trace-directory=${APP_LIVE_SMOKE_TRACE_DIRECTORY:.live-smoke/traces}
spring.ai.model.decision=openai
